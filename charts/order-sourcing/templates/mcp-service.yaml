{{- if .Values.mcp.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "order-sourcing.mcpFullname" . }}
  labels:
    {{- include "order-sourcing.labels" . | nindent 4 }}
    app.kubernetes.io/component: mcp
spec:
  type: {{ .Values.mcp.service.type }}
  ports:
    - port: {{ .Values.mcp.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  # component=mcp keeps this Service on exactly one Deployment
  # (tests/test_service_selectors.py).
  selector:
    {{- include "order-sourcing.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: mcp
{{- end }}
