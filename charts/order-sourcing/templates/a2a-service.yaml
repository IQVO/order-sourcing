{{- if .Values.a2a.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "order-sourcing.a2aFullname" . }}
  labels:
    {{- include "order-sourcing.labels" . | nindent 4 }}
    app.kubernetes.io/component: a2a
spec:
  type: {{ .Values.a2a.service.type }}
  ports:
    - port: {{ .Values.a2a.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  # component=a2a keeps this Service on exactly one Deployment
  # (tests/test_service_selectors.py).
  selector:
    {{- include "order-sourcing.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: a2a
{{- end }}
