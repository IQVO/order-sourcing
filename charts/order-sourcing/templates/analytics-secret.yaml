{{- if and .Values.analytics.enabled (not .Values.analytics.database.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "order-sourcing.analyticsSecretName" . }}
  labels:
    {{- include "order-sourcing.labels" . | nindent 4 }}
    app.kubernetes.io/component: analytics-projector
type: Opaque
stringData:
  # The projector's read-write DSN (a DIRECT Postgres DSN, not PgBouncer: the
  # projector also runs the analytical migrations, which take a session lock).
  ANALYTICS_DATABASE_URL: {{ .Values.analytics.database.projectorUrl | quote }}
  # The reports reader's DSN: a read-only role where possible; falls back to
  # the projector DSN when reportsUrl is empty (local/dev).
  ANALYTICS_READER_DATABASE_URL: {{ .Values.analytics.database.reportsUrl | default .Values.analytics.database.projectorUrl | quote }}
{{- end }}
