# Non-secret configuration of the api component, mirrored from the env the
# Deployment renders and mounted into the api container with envFrom (the
# explicit env entries win for the same key); the Deployment's checksum/config
# annotation rolls the pods whenever any of it changes. Every key is a variable
# cmd/api reads (tests/render_test.sh). DATABASE_URL never lands here: it lives
# in the Secret (templates/secret.yaml or database.existingSecret).
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "order-sourcing.fullname" . }}
  labels:
    {{- include "order-sourcing.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
data:
  HTTP_ADDR: {{ .Values.config.httpAddr | quote }}
  LOG_LEVEL: {{ .Values.config.logLevel | quote }}
  EVENT_PUBLISHER: {{ .Values.config.eventPublisher | quote }}
  KAFKA_BROKERS: {{ .Values.kafka.brokers | quote }}
  CUSTOMER_ORDERING_CONSUMER_GROUP: {{ .Values.config.customerOrderingConsumerGroup | quote }}
  DELIVERY_PROMISE_CONSUMER_GROUP: {{ .Values.config.deliveryPromiseConsumerGroup | quote }}
  LAST_MILE_DELIVERY_CONSUMER_GROUP: {{ .Values.config.lastMileDeliveryConsumerGroup | quote }}
  LINEHAUL_TRANSPORTATION_CONSUMER_GROUP: {{ .Values.config.linehaulTransportationConsumerGroup | quote }}
  NODE_PERFORMANCE_CONSUMER_GROUP: {{ .Values.config.nodePerformanceConsumerGroup | quote }}
  NODE_TOPOLOGY_CONSUMER_GROUP: {{ .Values.config.nodeTopologyConsumerGroup | quote }}
  OFFER_AVAILABILITY_CONSUMER_GROUP: {{ .Values.config.offerAvailabilityConsumerGroup | quote }}
  SHIPPING_AND_TRACKING_CONSUMER_GROUP: {{ .Values.config.shippingAndTrackingConsumerGroup | quote }}
  VENDOR_CONNECTIVITY_CONSUMER_GROUP: {{ .Values.config.vendorConnectivityConsumerGroup | quote }}
  OUTBOX_MAX_ATTEMPTS: {{ .Values.config.outboxMaxAttempts | quote }}
  SHUTDOWN_DRAIN_DELAY: {{ .Values.config.shutdownDrainDelay | quote }}
  {{- with .Values.config.outboxRelayInterval }}
  OUTBOX_RELAY_INTERVAL: {{ . | quote }}
  {{- end }}
  {{- with .Values.config.sweepInterval }}
  SWEEP_INTERVAL: {{ . | quote }}
  {{- end }}
