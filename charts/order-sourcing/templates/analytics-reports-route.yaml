{{- if and .Values.analytics.enabled .Values.analytics.reports.route.enabled -}}
{{- /*
Analytics reports exposure through Kong (fleet decision 2026-10-13: Kong config
lives in the application charts). Host contract: /api/order-sourcing/reports
-> Service <release>-reports:80, prefix rewritten to /reports (the binary
registers GET /reports/<name>). NO auth plugin (fleet-wide revert 2026-09-11).
*/ -}}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "order-sourcing.reportsFullname" . }}
  labels:
    {{- include "order-sourcing.labels" . | nindent 4 }}
    app.kubernetes.io/component: analytics-reports
spec:
  parentRefs:
    {{- range .Values.analytics.reports.route.parentRefs }}
    - name: {{ .name }}
      namespace: {{ .namespace }}
      {{- if .sectionName }}
      sectionName: {{ .sectionName }}
      {{- end }}
    {{- end }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: {{ .Values.analytics.reports.route.path }}
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /reports
      backendRefs:
        - name: {{ include "order-sourcing.reportsFullname" . }}
          port: {{ .Values.analytics.reports.service.port }}
{{- end }}
