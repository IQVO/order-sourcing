{{- if .Values.analytics.enabled }}
{{- include "order-sourcing.requireAnalytics" . -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "order-sourcing.projectorFullname" . }}
  labels:
    {{- include "order-sourcing.labels" . | nindent 4 }}
    app.kubernetes.io/component: analytics-projector
spec:
  replicas: {{ .Values.analytics.projector.replicaCount }}
  selector:
    matchLabels:
      {{- include "order-sourcing.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: analytics-projector
  template:
    metadata:
      labels:
        {{- include "order-sourcing.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: analytics-projector
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "order-sourcing.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      containers:
        - name: projector
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: {{ include "order-sourcing.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/app/os-projector"]
          ports:
            - name: admin
              containerPort: {{ .Values.analytics.projector.adminPort }}
              protocol: TCP
          # Env contract verified against cmd/os-projector (ADR 0013). The
          # projector writes ONLY the analytical database: it never gets the
          # OLTP DATABASE_URL or the api ConfigMap. It reads only this context's
          # own retailnetwork.order-sourcing.events and .analytics topics.
          env:
            - name: ADMIN_ADDR
              value: {{ .Values.analytics.projector.adminAddr | quote }}
            - name: KAFKA_BROKERS
              value: {{ .Values.kafka.brokers | quote }}
            # The FIXED consumer group: a stable id lets a rescheduled pod
            # resume from its committed offsets; a brand-new group rebuilds the
            # model from the earliest retained offset.
            - name: ANALYTICS_CONSUMER_GROUP
              value: {{ .Values.analytics.projector.consumerGroup | quote }}
            - name: LOG_LEVEL
              value: {{ .Values.analytics.logLevel | quote }}
            - name: SERVICE_VERSION
              value: {{ .Values.image.tag | default .Chart.AppVersion | quote }}
            - name: ENVIRONMENT
              value: {{ .Values.environment | quote }}
            {{- if .Values.otel.enabled }}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ .Values.otel.endpoint | quote }}
            - name: OTEL_SERVICE_NAME
              value: {{ printf "%s-projector" .Values.otel.serviceName | quote }}
            {{- end }}
            - name: ANALYTICS_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "order-sourcing.analyticsSecretName" . }}
                  key: ANALYTICS_DATABASE_URL
          startupProbe:
            httpGet:
              path: /healthz
              port: admin
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /healthz
              port: admin
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            # /readyz flips to 503 as the first step of the shutdown and while
            # the analytical database does not answer.
            httpGet:
              path: /readyz
              port: admin
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            {{- toYaml .Values.analytics.projector.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
