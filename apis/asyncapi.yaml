asyncapi: 3.0.0
info:
  title: order-sourcing Domain Events
  version: 1.0.0
  contact:
    name: order-sourcing maintainers
    url: https://github.com/IQVO/order-sourcing
    email: order-sourcing@iqvo.example.com
  license:
    name: UNLICENSED
  tags:
  - name: order-sourcing
    description: The order-sourcing bounded context (retail network, commerce tier, Core).
  - name: assignment
    description: Events raised by the FulfillmentAssignment aggregate.
  - name: consumed
    description: Events of sibling contexts this service consumes into its local read models or as commands.
  description: 'Event catalog for the **order-sourcing** bounded context of the retail network (commerce tier):
    it decides which vendor node and path fulfil each shipment group (ADR 0001, ADR 0002).


    **Published.** Ten events of the FulfillmentAssignment aggregate (entity `assignment`): eight on `retailnetwork.order-sourcing.events`
    and the two analytics-only ones (FulfillmentQueued, FulfillmentDelivered) ONLY on `retailnetwork.order-sourcing.analytics`,
    through a **transactional outbox**: the aggregate row and its already-encoded events are written in ONE database
    transaction and an always-on relay drains them to Kafka (at-least-once; the CloudEvents `id` is stored with
    the outbox row, so a retry republishes the same `id`). The ten types are catalogued in ADR 0004.


    **Consumed.** Thirty-two event types from nine producers (ADR 0003): commands that drive the aggregate (CustomerOrderPlaced,
    CustomerOrderCancelled, PromiseRevised, the purchase-order outcomes, VendorShipmentConfirmed, PackageDelivered,
    BookingMoved) and the events that feed the five local read models (NodeProfileView, NetworkGraphView, AvailabilityView,
    ScorecardView, PromiseBookPressureView). Every consumer is idempotent on the CloudEvents `id` and dispatches
    on the full `type`; unknown types and fields are ignored.


    **Envelope (mandatory).** CloudEvents 1.0, structured content mode, Kafka header `content-type: application/cloudevents+json;
    charset=UTF-8`. `specversion`, `id`, `source` (`/retailnetwork/order-sourcing`), `type`, `subject` (the assignmentId),
    `time`, `datacontenttype` (`application/json`) and `dataschema` (`urn:retailnetwork:order-sourcing:<stream>:<EventName>:v1`)
    are all required. Kafka key = the subject. Type = `com.retailnetwork.commerce.order-sourcing.assignment.<EventName>`.
    A breaking payload change is a new `.v2` type, never a mutation.


    **Conventions.** `data` is camelCase; timestamps are RFC 3339 UTC; optional fields are omitted when unset; arrays
    are always present.'
servers:
  production:
    host: '{brokers}'
    protocol: kafka
    description: Retail-network Kafka broker (host supplied by the deployment environment via KAFKA_BROKERS).
    variables:
      brokers:
        default: kafka.retail-network.internal:9092
defaultContentType: application/cloudevents+json
channels:
  orderSourcingEvents:
    address: retailnetwork.order-sourcing.events
    title: order-sourcing integration topic
    description: This service's integration topic. Written by the outbox relay; key = subject = assignmentId, so
      one assignment's events stay ordered on one partition. Every message carries the CloudEvents content-type
      header. Dispatch on the full `type`, ignore unknown types, dedupe on `id`.
    messages:
      FulfillmentReleasedToNode:
        $ref: '#/components/messages/FulfillmentReleasedToNode'
      FulfillmentReassigned:
        $ref: '#/components/messages/FulfillmentReassigned'
      FulfillmentLocked:
        $ref: '#/components/messages/FulfillmentLocked'
      FulfillmentShipped:
        $ref: '#/components/messages/FulfillmentShipped'
      FulfillmentUnsourceable:
        $ref: '#/components/messages/FulfillmentUnsourceable'
      FulfillmentCancelled:
        $ref: '#/components/messages/FulfillmentCancelled'
      FulfillmentCancelRefused:
        $ref: '#/components/messages/FulfillmentCancelRefused'
      FulfillmentConstraintRevised:
        $ref: '#/components/messages/FulfillmentConstraintRevised'
  orderSourcingAnalytics:
    address: retailnetwork.order-sourcing.analytics
    title: order-sourcing analytics topic
    description: 'Analytics-only events (model: consumers analytics only). They go ONLY to this topic, never to
      the integration topic. Same envelope, `dataschema` stream segment `analytics`.'
    messages:
      FulfillmentQueued:
        $ref: '#/components/messages/FulfillmentQueued'
      FulfillmentDelivered:
        $ref: '#/components/messages/FulfillmentDelivered'
  customerOrderingEvents:
    address: retailnetwork.customer-ordering.events
    title: customer-ordering integration topic
    description: customer-ordering's integration topic. This service consumes `CustomerOrderPlaced`, `CustomerOrderCancelled`
      under the stable consumer group read from the mandatory environment variable named in the operation. Every
      other type on the topic is ignored.
    messages:
      CustomerOrderPlaced:
        $ref: '#/components/messages/CustomerOrderPlaced'
      CustomerOrderCancelled:
        $ref: '#/components/messages/CustomerOrderCancelled'
  deliveryPromiseEvents:
    address: retailnetwork.delivery-promise.events
    title: delivery-promise integration topic
    description: delivery-promise's integration topic. This service consumes `PromiseRevised`, `PromiseBookExhausted`
      under the stable consumer group read from the mandatory environment variable named in the operation. Every
      other type on the topic is ignored.
    messages:
      PromiseRevised:
        $ref: '#/components/messages/PromiseRevised'
      PromiseBookExhausted:
        $ref: '#/components/messages/PromiseBookExhausted'
  lastMileDeliveryEvents:
    address: retailnetwork.last-mile-delivery.events
    title: last-mile-delivery integration topic
    description: last-mile-delivery's integration topic. This service consumes `DeliveryWaveScheduled`, `DeliveryWaveCapacityChanged`,
      `DeliveryWaveCancelled` under the stable consumer group read from the mandatory environment variable named
      in the operation. Every other type on the topic is ignored.
    messages:
      DeliveryWaveScheduled:
        $ref: '#/components/messages/DeliveryWaveScheduled'
      DeliveryWaveCapacityChanged:
        $ref: '#/components/messages/DeliveryWaveCapacityChanged'
      DeliveryWaveCancelled:
        $ref: '#/components/messages/DeliveryWaveCancelled'
  linehaulTransportationEvents:
    address: retailnetwork.linehaul-transportation.events
    title: linehaul-transportation integration topic
    description: linehaul-transportation's integration topic. This service consumes `DepartureScheduled`, `DepartureCapacityChanged`,
      `DepartureCancelled`, `BookingMoved`, `BookingFailed` under the stable consumer group read from the mandatory
      environment variable named in the operation. Every other type on the topic is ignored.
    messages:
      DepartureScheduled:
        $ref: '#/components/messages/DepartureScheduled'
      DepartureCapacityChanged:
        $ref: '#/components/messages/DepartureCapacityChanged'
      DepartureCancelled:
        $ref: '#/components/messages/DepartureCancelled'
      BookingMoved:
        $ref: '#/components/messages/BookingMoved'
      BookingFailed:
        $ref: '#/components/messages/BookingFailed'
  nodePerformanceEvents:
    address: retailnetwork.node-performance.events
    title: node-performance integration topic
    description: node-performance's integration topic. This service consumes `NodeScorecardUpdated` under the stable
      consumer group read from the mandatory environment variable named in the operation. Every other type on the
      topic is ignored.
    messages:
      NodeScorecardUpdated:
        $ref: '#/components/messages/NodeScorecardUpdated'
  nodeTopologyEvents:
    address: retailnetwork.node-topology.events
    title: node-topology integration topic
    description: node-topology's integration topic. This service consumes `NodeRegistered`, `NodeOperationalProfileDeclared`,
      `NodeActivated`, `NodeSuspended`, `NodeRetired`, `LaneOpened`, `LaneClosed`, `ServiceAreaAssigned`, `RegionDefined`
      under the stable consumer group read from the mandatory environment variable named in the operation. Every
      other type on the topic is ignored.
    messages:
      NodeRegistered:
        $ref: '#/components/messages/NodeRegistered'
      NodeOperationalProfileDeclared:
        $ref: '#/components/messages/NodeOperationalProfileDeclared'
      NodeActivated:
        $ref: '#/components/messages/NodeActivated'
      NodeSuspended:
        $ref: '#/components/messages/NodeSuspended'
      NodeRetired:
        $ref: '#/components/messages/NodeRetired'
      LaneOpened:
        $ref: '#/components/messages/LaneOpened'
      LaneClosed:
        $ref: '#/components/messages/LaneClosed'
      ServiceAreaAssigned:
        $ref: '#/components/messages/ServiceAreaAssigned'
      RegionDefined:
        $ref: '#/components/messages/RegionDefined'
  offerAvailabilityEvents:
    address: retailnetwork.offer-availability.events
    title: offer-availability integration topic
    description: offer-availability's integration topic. This service consumes `ListingCreated`, `ListingAvailabilityChanged`,
      `ListingSuppressed`, `ListingRestored`, `CatalogItemDiscontinued` under the stable consumer group read from
      the mandatory environment variable named in the operation. Every other type on the topic is ignored.
    messages:
      ListingCreated:
        $ref: '#/components/messages/ListingCreated'
      ListingAvailabilityChanged:
        $ref: '#/components/messages/ListingAvailabilityChanged'
      ListingSuppressed:
        $ref: '#/components/messages/ListingSuppressed'
      ListingRestored:
        $ref: '#/components/messages/ListingRestored'
      CatalogItemDiscontinued:
        $ref: '#/components/messages/CatalogItemDiscontinued'
  shippingAndTrackingEvents:
    address: retailnetwork.shipping-and-tracking.events
    title: shipping-and-tracking integration topic
    description: shipping-and-tracking's integration topic. This service consumes `PackageDelivered` under the stable
      consumer group read from the mandatory environment variable named in the operation. Every other type on the
      topic is ignored.
    messages:
      PackageDelivered:
        $ref: '#/components/messages/PackageDelivered'
  vendorConnectivityEvents:
    address: retailnetwork.vendor-connectivity.events
    title: vendor-connectivity integration topic
    description: vendor-connectivity's integration topic. This service consumes `PurchaseOrderAccepted`, `PurchaseOrderRejected`,
      `PurchaseOrderExpired`, `VendorShipmentConfirmed` under the stable consumer group read from the mandatory
      environment variable named in the operation. Every other type on the topic is ignored.
    messages:
      PurchaseOrderAccepted:
        $ref: '#/components/messages/PurchaseOrderAccepted'
      PurchaseOrderRejected:
        $ref: '#/components/messages/PurchaseOrderRejected'
      PurchaseOrderExpired:
        $ref: '#/components/messages/PurchaseOrderExpired'
      VendorShipmentConfirmed:
        $ref: '#/components/messages/VendorShipmentConfirmed'
operations:
  publishOrderSourcingEvents:
    action: send
    title: Publish order-sourcing integration events
    summary: Publish the eight integration events through the transactional outbox.
    description: The service sends the integration events of FulfillmentAssignment to `retailnetwork.order-sourcing.events`.
      Consumers route on the full `type`.
    tags:
    - name: assignment
    channel:
      $ref: '#/channels/orderSourcingEvents'
    messages:
    - $ref: '#/channels/orderSourcingEvents/messages/FulfillmentReleasedToNode'
    - $ref: '#/channels/orderSourcingEvents/messages/FulfillmentReassigned'
    - $ref: '#/channels/orderSourcingEvents/messages/FulfillmentLocked'
    - $ref: '#/channels/orderSourcingEvents/messages/FulfillmentShipped'
    - $ref: '#/channels/orderSourcingEvents/messages/FulfillmentUnsourceable'
    - $ref: '#/channels/orderSourcingEvents/messages/FulfillmentCancelled'
    - $ref: '#/channels/orderSourcingEvents/messages/FulfillmentCancelRefused'
    - $ref: '#/channels/orderSourcingEvents/messages/FulfillmentConstraintRevised'
  publishOrderSourcingAnalytics:
    action: send
    title: Publish order-sourcing analytics events
    summary: Publish the two analytics-only events through the transactional outbox.
    description: 'FulfillmentQueued and FulfillmentDelivered are analytics only: they are sent ONLY to `retailnetwork.order-sourcing.analytics`.'
    tags:
    - name: assignment
    channel:
      $ref: '#/channels/orderSourcingAnalytics'
    messages:
    - $ref: '#/channels/orderSourcingAnalytics/messages/FulfillmentQueued'
    - $ref: '#/channels/orderSourcingAnalytics/messages/FulfillmentDelivered'
  consumeCustomerOrdering:
    action: receive
    title: Consume customer-ordering events
    summary: Consume 2 event type(s) of customer-ordering.
    description: Idempotent on the CloudEvents `id` (inbox table processed_events, written in the same transaction
      as the effect); dispatch on the full `type`; deterministic poison goes to the DLQ. Consumer group from `CUSTOMER_ORDERING_CONSUMER_GROUP`.
    tags:
    - name: consumed
    channel:
      $ref: '#/channels/customerOrderingEvents'
    messages:
    - $ref: '#/channels/customerOrderingEvents/messages/CustomerOrderPlaced'
    - $ref: '#/channels/customerOrderingEvents/messages/CustomerOrderCancelled'
  consumeDeliveryPromise:
    action: receive
    title: Consume delivery-promise events
    summary: Consume 2 event type(s) of delivery-promise.
    description: Idempotent on the CloudEvents `id` (inbox table processed_events, written in the same transaction
      as the effect); dispatch on the full `type`; deterministic poison goes to the DLQ. Consumer group from `DELIVERY_PROMISE_CONSUMER_GROUP`.
    tags:
    - name: consumed
    channel:
      $ref: '#/channels/deliveryPromiseEvents'
    messages:
    - $ref: '#/channels/deliveryPromiseEvents/messages/PromiseRevised'
    - $ref: '#/channels/deliveryPromiseEvents/messages/PromiseBookExhausted'
  consumeLastMileDelivery:
    action: receive
    title: Consume last-mile-delivery events
    summary: Consume 3 event type(s) of last-mile-delivery.
    description: Idempotent on the CloudEvents `id` (inbox table processed_events, written in the same transaction
      as the effect); dispatch on the full `type`; deterministic poison goes to the DLQ. Consumer group from `LAST_MILE_DELIVERY_CONSUMER_GROUP`.
    tags:
    - name: consumed
    channel:
      $ref: '#/channels/lastMileDeliveryEvents'
    messages:
    - $ref: '#/channels/lastMileDeliveryEvents/messages/DeliveryWaveScheduled'
    - $ref: '#/channels/lastMileDeliveryEvents/messages/DeliveryWaveCapacityChanged'
    - $ref: '#/channels/lastMileDeliveryEvents/messages/DeliveryWaveCancelled'
  consumeLinehaulTransportation:
    action: receive
    title: Consume linehaul-transportation events
    summary: Consume 5 event type(s) of linehaul-transportation.
    description: Idempotent on the CloudEvents `id` (inbox table processed_events, written in the same transaction
      as the effect); dispatch on the full `type`; deterministic poison goes to the DLQ. Consumer group from `LINEHAUL_TRANSPORTATION_CONSUMER_GROUP`.
    tags:
    - name: consumed
    channel:
      $ref: '#/channels/linehaulTransportationEvents'
    messages:
    - $ref: '#/channels/linehaulTransportationEvents/messages/DepartureScheduled'
    - $ref: '#/channels/linehaulTransportationEvents/messages/DepartureCapacityChanged'
    - $ref: '#/channels/linehaulTransportationEvents/messages/DepartureCancelled'
    - $ref: '#/channels/linehaulTransportationEvents/messages/BookingMoved'
    - $ref: '#/channels/linehaulTransportationEvents/messages/BookingFailed'
  consumeNodePerformance:
    action: receive
    title: Consume node-performance events
    summary: Consume 1 event type(s) of node-performance.
    description: Idempotent on the CloudEvents `id` (inbox table processed_events, written in the same transaction
      as the effect); dispatch on the full `type`; deterministic poison goes to the DLQ. Consumer group from `NODE_PERFORMANCE_CONSUMER_GROUP`.
    tags:
    - name: consumed
    channel:
      $ref: '#/channels/nodePerformanceEvents'
    messages:
    - $ref: '#/channels/nodePerformanceEvents/messages/NodeScorecardUpdated'
  consumeNodeTopology:
    action: receive
    title: Consume node-topology events
    summary: Consume 9 event type(s) of node-topology.
    description: Idempotent on the CloudEvents `id` (inbox table processed_events, written in the same transaction
      as the effect); dispatch on the full `type`; deterministic poison goes to the DLQ. Consumer group from `NODE_TOPOLOGY_CONSUMER_GROUP`.
    tags:
    - name: consumed
    channel:
      $ref: '#/channels/nodeTopologyEvents'
    messages:
    - $ref: '#/channels/nodeTopologyEvents/messages/NodeRegistered'
    - $ref: '#/channels/nodeTopologyEvents/messages/NodeOperationalProfileDeclared'
    - $ref: '#/channels/nodeTopologyEvents/messages/NodeActivated'
    - $ref: '#/channels/nodeTopologyEvents/messages/NodeSuspended'
    - $ref: '#/channels/nodeTopologyEvents/messages/NodeRetired'
    - $ref: '#/channels/nodeTopologyEvents/messages/LaneOpened'
    - $ref: '#/channels/nodeTopologyEvents/messages/LaneClosed'
    - $ref: '#/channels/nodeTopologyEvents/messages/ServiceAreaAssigned'
    - $ref: '#/channels/nodeTopologyEvents/messages/RegionDefined'
  consumeOfferAvailability:
    action: receive
    title: Consume offer-availability events
    summary: Consume 5 event type(s) of offer-availability.
    description: Idempotent on the CloudEvents `id` (inbox table processed_events, written in the same transaction
      as the effect); dispatch on the full `type`; deterministic poison goes to the DLQ. Consumer group from `OFFER_AVAILABILITY_CONSUMER_GROUP`.
    tags:
    - name: consumed
    channel:
      $ref: '#/channels/offerAvailabilityEvents'
    messages:
    - $ref: '#/channels/offerAvailabilityEvents/messages/ListingCreated'
    - $ref: '#/channels/offerAvailabilityEvents/messages/ListingAvailabilityChanged'
    - $ref: '#/channels/offerAvailabilityEvents/messages/ListingSuppressed'
    - $ref: '#/channels/offerAvailabilityEvents/messages/ListingRestored'
    - $ref: '#/channels/offerAvailabilityEvents/messages/CatalogItemDiscontinued'
  consumeShippingAndTracking:
    action: receive
    title: Consume shipping-and-tracking events
    summary: Consume 1 event type(s) of shipping-and-tracking.
    description: Idempotent on the CloudEvents `id` (inbox table processed_events, written in the same transaction
      as the effect); dispatch on the full `type`; deterministic poison goes to the DLQ. Consumer group from `SHIPPING_AND_TRACKING_CONSUMER_GROUP`.
    tags:
    - name: consumed
    channel:
      $ref: '#/channels/shippingAndTrackingEvents'
    messages:
    - $ref: '#/channels/shippingAndTrackingEvents/messages/PackageDelivered'
  consumeVendorConnectivity:
    action: receive
    title: Consume vendor-connectivity events
    summary: Consume 4 event type(s) of vendor-connectivity.
    description: Idempotent on the CloudEvents `id` (inbox table processed_events, written in the same transaction
      as the effect); dispatch on the full `type`; deterministic poison goes to the DLQ. Consumer group from `VENDOR_CONNECTIVITY_CONSUMER_GROUP`.
    tags:
    - name: consumed
    channel:
      $ref: '#/channels/vendorConnectivityEvents'
    messages:
    - $ref: '#/channels/vendorConnectivityEvents/messages/PurchaseOrderAccepted'
    - $ref: '#/channels/vendorConnectivityEvents/messages/PurchaseOrderRejected'
    - $ref: '#/channels/vendorConnectivityEvents/messages/PurchaseOrderExpired'
    - $ref: '#/channels/vendorConnectivityEvents/messages/VendorShipmentConfirmed'
components:
  messages:
    FulfillmentQueued:
      name: FulfillmentQueued
      title: A shipment group entered the virtual queue
      summary: A shipment group entered the virtual queue.
      description: '`type` = `com.retailnetwork.commerce.order-sourcing.assignment.FulfillmentQueued`; subject and
        key = the assignmentId; stream `analytics` (topic `retailnetwork.order-sourcing.analytics`). Raised by QueueAssignment.
        Analytics only (model: consumers analytics only): published ONLY to retailnetwork.order-sourcing.analytics.
        `lines` carry no listingId because no node is chosen yet.'
      contentType: application/cloudevents+json
      tags:
      - name: assignment
      payload:
        $ref: '#/components/schemas/FulfillmentQueuedEvent'
      examples:
      - name: FulfillmentQueued
        summary: A shipment group entered the virtual queue.
        payload:
          specversion: '1.0'
          id: 3f6c2a9e-8b1d-4c7a-9e55-0d2f6b7a1c76
          source: /retailnetwork/order-sourcing
          type: com.retailnetwork.commerce.order-sourcing.assignment.FulfillmentQueued
          subject: asg-7f3c2d10
          time: '2026-10-22T19:01:00Z'
          datacontenttype: application/json
          dataschema: urn:retailnetwork:order-sourcing:analytics:FulfillmentQueued:v1
          data:
            assignmentId: asg-7f3c2d10
            orderId: ord-51a0c9
            groupNo: 1
            promiseId: prm-88c1
            deliverByLatest: '2026-10-24T23:00:00Z'
            lines:
            - lineNo: 1
              catalogItemId: cat-000123
              quantity: 2
    FulfillmentReleasedToNode:
      name: FulfillmentReleasedToNode
      title: A group was released to one vendor node (a purchase order follows)
      summary: A group was released to one vendor node (a purchase order follows).
      description: '`type` = `com.retailnetwork.commerce.order-sourcing.assignment.FulfillmentReleasedToNode`; subject
        and key = the assignmentId; stream `events` (topic `retailnetwork.order-sourcing.events`). Raised by ReleaseToNode
        (QUEUED to RELEASED). `releaseNo` is 1 for the first release and +1 for each later one; with `assignmentId`
        it is the purchase order''s idempotency key. `lines` is the whole group (fill-or-kill) with this node''s
        listingId. No ship-to data: the release carries no PII. Consumers: vendor-connectivity, linehaul-transportation.'
      contentType: application/cloudevents+json
      tags:
      - name: assignment
      payload:
        $ref: '#/components/schemas/FulfillmentReleasedToNodeEvent'
      examples:
      - name: FulfillmentReleasedToNode
        summary: A group was released to one vendor node (a purchase order follows).
        payload:
          specversion: '1.0'
          id: 3f6c2a9e-8b1d-4c7a-9e55-0d2f6b7a1c66
          source: /retailnetwork/order-sourcing
          type: com.retailnetwork.commerce.order-sourcing.assignment.FulfillmentReleasedToNode
          subject: asg-7f3c2d10
          time: '2026-10-22T19:01:00Z'
          datacontenttype: application/json
          dataschema: urn:retailnetwork:order-sourcing:events:FulfillmentReleasedToNode:v1
          data:
            assignmentId: asg-7f3c2d10
            releaseNo: 1
            orderId: ord-51a0c9
            groupNo: 1
            nodeId: node-fc-ws-sor-01
            pickupDepartureId: dep-pk-20261022-1800-fc-ws-sor-01
            requiredShipBy: '2026-10-22T21:00:00Z'
            promisedDeliverByLatest: '2026-10-24T23:00:00Z'
            tier: TWO_DAY
            lines:
            - catalogItemId: cat-000123
              listingId: lst-000123-fc-ws-sor-01
              quantity: 2
    FulfillmentReassigned:
      name: FulfillmentReassigned
      title: The candidate node of a group changed
      summary: The candidate node of a group changed.
      description: '`type` = `com.retailnetwork.commerce.order-sourcing.assignment.FulfillmentReassigned`; subject
        and key = the assignmentId; stream `events` (topic `retailnetwork.order-sourcing.events`). Raised when the
        candidate NODE changes: ReoptimiseAssignment, the release re-check, HandleNodeRefusal on another node, or
        ApplyRevisedPromise. `reason` is one of REOPTIMISED, RELEASE_RECHECK, PURCHASE_ORDER_REJECTED, PURCHASE_ORDER_EXPIRED,
        PROMISE_REVISED. `assignmentVersion` is the version after the change, so consumers can drop stale copies.
        Consumer: linehaul-transportation.'
      contentType: application/cloudevents+json
      tags:
      - name: assignment
      payload:
        $ref: '#/components/schemas/FulfillmentReassignedEvent'
      examples:
      - name: FulfillmentReassigned
        summary: The candidate node of a group changed.
        payload:
          specversion: '1.0'
          id: 3f6c2a9e-8b1d-4c7a-9e55-0d2f6b7a1c19
          source: /retailnetwork/order-sourcing
          type: com.retailnetwork.commerce.order-sourcing.assignment.FulfillmentReassigned
          subject: asg-7f3c2d10
          time: '2026-10-22T19:01:00Z'
          datacontenttype: application/json
          dataschema: urn:retailnetwork:order-sourcing:events:FulfillmentReassigned:v1
          data:
            assignmentId: asg-7f3c2d10
            fromNodeId: node-fc-ws-sor-01
            toNodeId: node-fc-ws-sor-02
            reason: PURCHASE_ORDER_REJECTED
            assignmentVersion: 4
    FulfillmentLocked:
      name: FulfillmentLocked
      title: The node accepted; the assignment is locked for good
      summary: The node accepted; the assignment is locked for good.
      description: '`type` = `com.retailnetwork.commerce.order-sourcing.assignment.FulfillmentLocked`; subject and
        key = the assignmentId; stream `events` (topic `retailnetwork.order-sourcing.events`). Raised by LockAssignment
        (RELEASED to LOCKED) on PurchaseOrderAccepted. Adds promiseId, groupNo and orderId (contracts-delta E1)
        so delivery-promise can keep its assignmentId map. `lockReason` is PURCHASE_ORDER_ACCEPTED. Consumers: delivery-promise,
        customer-ordering, linehaul-transportation.'
      contentType: application/cloudevents+json
      tags:
      - name: assignment
      payload:
        $ref: '#/components/schemas/FulfillmentLockedEvent'
      examples:
      - name: FulfillmentLocked
        summary: The node accepted; the assignment is locked for good.
        payload:
          specversion: '1.0'
          id: 3f6c2a9e-8b1d-4c7a-9e55-0d2f6b7a1c40
          source: /retailnetwork/order-sourcing
          type: com.retailnetwork.commerce.order-sourcing.assignment.FulfillmentLocked
          subject: asg-7f3c2d10
          time: '2026-10-22T19:01:00Z'
          datacontenttype: application/json
          dataschema: urn:retailnetwork:order-sourcing:events:FulfillmentLocked:v1
          data:
            assignmentId: asg-7f3c2d10
            orderId: ord-51a0c9
            groupNo: 1
